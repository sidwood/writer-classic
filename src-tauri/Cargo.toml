[package]
name = "writer-classic"
version = "0.1.0"
description = "Classic plain-text writing for Apple Silicon"
authors = ["Sid Wood"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
objc2-foundation = { version = "0.3.2", features = ["NSFileVersion", "NSFileManager", "NSURL", "NSString", "NSDate", "NSArray", "NSError", "NSRange"] }
objc2-app-kit = { version = "0.3.2", features = ["NSSpellChecker"] }
objc2 = "0.6.4"
url = "2.5.8"
